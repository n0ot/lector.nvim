name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - neovim: v0.12.0
            label: 0.12.0 minimum
          - neovim: v0.12.5
            label: 0.12.5
          - neovim: nightly
            label: 0.13 nightly
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Neovim ${{ matrix.neovim }}
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          version: ${{ matrix.neovim }}
          neovim: true

      - name: Run headless and PTY tests
        run: ./scripts/test

      - name: Validate help tags
        run: nvim --headless -u NONE -i NONE -n "+helptags doc" +qa!
